repos:
  - repo: local
    hooks:
      - id: ruff-format-check
        name: ruff format --check .
        entry: ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: ruff check .
        entry: ruff check .
        language: system
        pass_filenames: false
        always_run: true
